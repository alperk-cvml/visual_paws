# Root compose file — delegates to each module's own docker-compose.yaml.
# Requires Docker Compose v2.20+ (compose-spec `include` support).
#
# Usage (from repo root):
#   docker compose up --build
#   docker compose up quadruped_gazebo depth_image_proc   # start a subset
#
# To override any variable, set it in the environment or in a .env file.

include:
  - path: src/quadruped_gazebo/docker-compose.yaml
  - path: src/rviz/docker-compose.yaml
  - path: src/dept_image_proc/docker-compose.yaml
  - path: src/elevation_mapping_cupy_pkg/docker-compose.yaml
  - path: src/quadruped_gait_controller/docker-compose.yaml
  - path: src/quadruped_leg_odometry/docker-compose.yaml
  - path: src/ground_plane_estimation/docker-compose.yaml
  - path: src/quadruped_test_controller/docker-compose.yaml
  - path: src/nav2_mppi_navigation/docker-compose.yaml
  - path: src/monocular_depth/docker-compose.yaml
  - path: src/depth_comparison/docker-compose.yaml
  - path: src/localization/docker-compose.yaml
  - path: src/lidar_odometry/docker-compose.yaml
  - path: src/video_camera_sim/docker-compose.yaml
    #  - path: src/elevation_mapping/docker-compose.yaml
