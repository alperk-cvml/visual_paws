grid_map_visualization:
  ros__parameters:
    use_sim_time: true
    grid_map_topic: /elevation_mapping_node/elevation_map
    publish_rate: 10.0

    grid_map_visualizations:
      - occupancy_grid_layer

    occupancy_grid_layer:
      type: occupancy_grid
      topic: /occupancy_grid
      layer: traversability
      data_min: 1.0
      data_max: 0.0
