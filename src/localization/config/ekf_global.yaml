# Global estimator. This filter is the sole owner of map->odom.
/**:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    frequency: 30.0
    sensor_timeout: 0.5
    two_d_mode: false
    publish_tf: true
    transform_time_offset: 0.0
    transform_timeout: 0.1

    # Smooth local pose, already expressed in odom.
    odom0: /odom
    odom0_config: [true,  true,  true,
                   true,  true,  true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # Absolute, loop-closure-corrected pose expressed in map.
    odom1: /odom_slam
    odom1_config: [true,  true,  true,
                   true,  true,  true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 5
