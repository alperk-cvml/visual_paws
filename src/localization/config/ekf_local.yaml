# Continuous local estimator. This filter is the sole owner of odom->base_link.
/**:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: false
    publish_tf: true
    transform_time_offset: 0.0
    transform_timeout: 0.1

    # Temporary simulation source. Replace this topic with /odom_lko when
    # leg-kinematics odometry is implemented.
    odom0: /odom_ground_truth
    odom0_config: [true,  true,  true,
                   true,  true,  true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # Leg-kinematics odometry (quadruped_leg_odometry container). To switch
    # from ground truth, delete the odom0 block above and uncomment this one.
    # Fuse the body-frame twist only — the integrated LKO pose drifts and its
    # covariance grows accordingly; the EKF should integrate velocities itself.
    # odom0: /odom_lko
    # odom0_config: [false, false, false,
    #                false, false, false,
    #                true,  true,  true,
    #                false, false, true,
    #                false, false, false]
    # odom0_differential: false
    # odom0_relative: false
    # odom0_queue_size: 10

    imu0: /imu/data
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  true,  true,  true]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: true

