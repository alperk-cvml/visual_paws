version: "3.9"

services:
  quadruped_gait_controller:
    image: quadruped-gait-controller:jazzy
    container_name: quadruped_gait_controller
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: jazzy

    environment:
      # ROS
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      - USE_SIM_TIME=${USE_SIM_TIME:-true}
      # trot | walk (see config/gait_params.yaml for everything else)
      - GAIT_TYPE=${GAIT_TYPE:-trot}

    volumes:
      # ROS 2 workspace
      - ../..:/work/ws:rw

    working_dir: /work/ws

    # Host networking for seamless ROS 2 DDS discovery with the simulation
    network_mode: host
    ipc: host

    # List form on purpose — see src/depth_comparison/docker-compose.yaml for
    # why a single-string command would split the launch arguments onto their
    # own lines and run `ros2 launch` bare.
    command:
      - bash
      - -lc
      - |
        set -e
        source /opt/ros/$${ROS_DISTRO}/setup.bash
        colcon build --symlink-install --packages-up-to quadruped_gait_controller
        source /work/ws/install/setup.bash
        ros2 launch quadruped_gait_controller gait.launch.py \
          use_sim_time:=$${USE_SIM_TIME} \
          gait_type:=$${GAIT_TYPE}
