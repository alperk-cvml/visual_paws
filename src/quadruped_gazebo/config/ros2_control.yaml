# ros2_control configuration for the Spot Micro quadruped
# Hardware plugin: gz_ros2_control/GazeboSimSystem (Gazebo Harmonic)

controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    quadruped_joint_controller:
      type: position_controllers/JointGroupPositionController

# gz_ros2_control tracks a position command by commanding a joint velocity of
# position_proportional_gain * error * update_rate. 0.1 at 500 Hz is a 50 /s
# velocity loop (20 ms time constant), a fair stand-in for a hobby servo's
# internal position loop; the URDF effort limit caps the resulting torque.
gz_ros2_control:
  ros__parameters:
    position_proportional_gain: 0.1

quadruped_joint_controller:
  ros__parameters:
    # Order is the contract with quadruped_kinematics.JOINT_ORDER and the
    # gait controller's Float64MultiArray layout.
    joints:
      - FL_hip_roll_joint
      - FL_hip_pitch_joint
      - FL_knee_joint
      - FR_hip_roll_joint
      - FR_hip_pitch_joint
      - FR_knee_joint
      - RL_hip_roll_joint
      - RL_hip_pitch_joint
      - RL_knee_joint
      - RR_hip_roll_joint
      - RR_hip_pitch_joint
      - RR_knee_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    open_loop_control: true
    allow_partial_joints_goal: false

joint_state_broadcaster:
  ros__parameters:
    joints:
      - FL_hip_roll_joint
      - FL_hip_pitch_joint
      - FL_knee_joint
      - FR_hip_roll_joint
      - FR_hip_pitch_joint
      - FR_knee_joint
      - RL_hip_roll_joint
      - RL_hip_pitch_joint
      - RL_knee_joint
      - RR_hip_roll_joint
      - RR_hip_pitch_joint
      - RR_knee_joint
