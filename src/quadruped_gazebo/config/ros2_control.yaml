# ros2_control configuration for quadruped robot
# Hardware plugin: gz_ros2_control/GazeboSimSystem  (Gazebo Harmonic)

controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    quadruped_joint_controller:
      type: position_controllers/JointGroupPositionController

quadruped_joint_controller:
  ros__parameters:
    joints:
      - FL_hip_roll_joint
      - FL_hip_pitch_joint
      - FL_knee_joint
      - FR_hip_roll_joint
      - FR_hip_pitch_joint
      - FR_knee_joint
      - RL_hip_roll_joint
      - RL_hip_pitch_joint
      - RL_knee_joint
      - RR_hip_roll_joint
      - RR_hip_pitch_joint
      - RR_knee_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    open_loop_control: true
    allow_partial_joints_goal: false

joint_state_broadcaster:
  ros__parameters:
    joints:
      - FL_hip_roll_joint
      - FL_hip_pitch_joint
      - FL_knee_joint
      - FR_hip_roll_joint
      - FR_hip_pitch_joint
      - FR_knee_joint
      - RL_hip_roll_joint
      - RL_hip_pitch_joint
      - RL_knee_joint
      - RR_hip_roll_joint
      - RR_hip_pitch_joint
      - RR_knee_joint
